<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#172d58"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="A little glider. A very big sky. Swipe through the clouds, collect stitches, and build your best flight.">
  <title>Skyline Stitch</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css">
</head>
<body><main id="app"><canvas id="sky" aria-label="Skyline Stitch flying game"></canvas>
  <section id="home" class="screen"><div class="brand">SKYLINE <strong>STITCH</strong></div><p class="tagline">A little glider. A very big sky.</p><div class="home-bottom"><p class="bestline">PERSONAL BEST <b id="bestHome">0 m</b></p><button id="play" class="primary">TAKE FLIGHT <span>↗</span></button><p class="hint">DRAG TO STEER · CATCH THE GLOWING GAPS</p></div></section>
  <section id="hud" class="hud hidden"><div><small>SKYLINE STITCH</small><b id="distance">0 m</b></div><div class="stitch-count">✦ <span id="stitches">0</span></div></section>
  <section id="result" class="screen hidden"><div class="result-card"><small>FLIGHT COMPLETE</small><h1 id="finalDistance">0 <em>m</em></h1><p id="record">A new personal best!</p><div class="collected">✦ <b id="finalStitches">0</b> stitches collected</div><div class="record-list"><small>YOUR BEST FLIGHTS</small><ol id="scores"></ol></div><button id="again" class="primary">FLY AGAIN <span>↗</span></button><button id="homeButton" class="text-button">BACK TO SKY</button></div></section>
  <div id="installTip" class="install-tip hidden">To install: tap <b>Share</b>, then <b>Add to Home Screen</b>.<button id="closeTip" aria-label="Close">×</button></div>
</main><script src="game.js"></script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
